name: Temporary Go module lock repair
on:
  push:
    branches: [fix/verify-windows-go-build-2026]
permissions:
  contents: write
jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - run: go mod tidy
      - run: cd cmd && go mod tidy
      - name: Save generated module sums to repair branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard -- '*go.sum')" ]; then
            git add -- go.mod go.sum cmd/go.mod cmd/go.sum
            git commit -m 'Reconcile Go module sums for Fyne dependencies [skip ci]'
            git push origin HEAD:refs/heads/fix/verify-windows-go-build-2026
          fi
